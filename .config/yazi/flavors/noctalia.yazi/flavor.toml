# : Manager [[[

[mgr]
cwd = { fg = "#ffffff" }

# Tab
tab_active = { fg = "#e6e1e5", bg = "#58a6ff", bold = true }
tab_inactive = { fg = "#004799", bg = "#ffffff" }
tab_width = 1

# Find
find_keyword = { fg = "#f85149", bold = true, italic = true, underline = true }
find_position = { fg = "#f85149", bold = true, italic = true }

# Marker
marker_copied = { fg = "#400099", bg = "#400099" }
marker_cut = { fg = "#400099", bg = "#400099" }
marker_marked = { fg = "#f85149", bg = "#f85149" }
marker_selected = { fg = "#bc8cff", bg = "#bc8cff" }

# Count
count_copied = { fg = "#ffffff", bg = "#400099" }
count_cut = { fg = "#ffffff", bg = "#400099" }
count_selected = { fg = "#e6e1e5", bg = "#bc8cff" }

# Border
border_style  = { fg = "#58a6ff" }

# : ]]]


# : Status [[[

[status]
separator_style = { bg = "#e6e1e5", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#58a6ff", fg = "#e6e1e5", bold = true }
normal_alt  = { bg = "#040e20", fg = "#ffffff" }

# Select mode
select_main = { bg = "#bc8cff", fg = "#e6e1e5", bold = true }
select_alt  = { bg = "#040e20", fg = "#ffffff" }

# Unset mode
unset_main = { bg = "#bc8cff", fg = "#e6e1e5", bold = true }
unset_alt  = { bg = "#040e20", fg = "#ffffff" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#58a6ff", bg = "#010409" }
progress_error = { fg = "#f85149", bg = "#010409" }

# Permissions
permissions_t = { fg = "#bc8cff" }
permissions_w = { fg = "#bc8cff" }
permissions_x = { fg = "#f85149" }
permissions_r = { fg = "#400099" }
permissions_s = { fg = "#004799" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#58a6ff" }
active = { fg = "#bc8cff", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#58a6ff" }
value = { fg = "#ffffff" }

# : ]]]

# : Tabs [[[

[tabs]
active = { fg = "#58a6ff", bold = true, bg = "#010409" }
inactive = { fg = "#bc8cff", bg = "#010409" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[completion]
border = { fg = "#58a6ff", bg = "#e6e1e5" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#58a6ff" }
title = {}
hovered = { fg = "#400099", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#010409" }
cand = { fg = "#58a6ff" }
rest = { fg = "#e6e1e5" }
desc = { fg = "#ffffff" }
separator = " ▶ "
separator_style = { fg = "#ffffff" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#ffffff" }
run = { fg = "#ffffff" }
footer = { fg = "#e6e1e5", bg = "#bc8cff" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#bc8cff" }
title_warn = { fg = "#58a6ff" }
title_error = { fg = "#f85149" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#990700" },
    { name = "*", is = "exec", fg = "#ffffff" },

    # Fallback
    { name = "*", fg = "#ffffff" },
    { name = "*/", fg = "#58a6ff" },
]

# : ]]]
